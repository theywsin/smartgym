# /etc/nginx/conf.d/smartgym.conf  (replace app.example.ir)
# Certificates: certbot --nginx -d app.example.ir   (see docs/DEPLOYMENT.md)
limit_req_zone $binary_remote_addr zone=sg_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sg_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.ir;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.ir;

    ssl_certificate     /etc/letsencrypt/live/app.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 5m;   # CSV import
    server_tokens off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # OTP and password login: tight per-IP limit on top of the app's own limits.
    location ~ ^/api/v1/auth/(otp|password)/ {
        limit_req zone=sg_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location /api/ {
        limit_req zone=sg_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
