# Local development services for SmartGym 2.0.
#   docker compose -f docker/compose.dev.yml up -d
# Then: see docs/PLATFORM_DEVELOPMENT.md
# Only Postgres is needed; the app does not use Redis or object storage yet.
name: smartgym-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartgym_owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: smartgym
    ports: ["${SMARTGYM_DB_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
volumes:
  pgdata:
