# SmartGym 2.0 production stack (Docker or Podman on AlmaLinux). See docs/DEPLOYMENT.md.
#   docker compose -f docker/compose.prod.yml --env-file /etc/smartgym/smartgym.env up -d --build
# Postgres is not published to the network; the web app listens on 127.0.0.1:3000 behind Nginx.
name: smartgym

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://smartgym_app:${APP_DB_PASSWORD:?}@postgres:5432/smartgym
  OTP_PEPPER: ${OTP_PEPPER:?}
  JWT_SECRET: ${JWT_SECRET:?}
  APP_URL: ${APP_URL:?}
  SMS_PROVIDER: ${SMS_PROVIDER:?}
  MELIPAYAMAK_API_KEY: ${MELIPAYAMAK_API_KEY:-}
  MELIPAYAMAK_OTP_BODY_ID: ${MELIPAYAMAK_OTP_BODY_ID:-}
  MELIPAYAMAK_EXPIRY_BODY_ID: ${MELIPAYAMAK_EXPIRY_BODY_ID:-}
  PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-saman}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartgym_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?}
      POSTGRES_DB: smartgym
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init-prod.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgym_owner -d smartgym"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies pending migrations as the owner role and syncs the base seed
  # (permissions, roles, plans). Never resets or drops data. Re-run on every deploy.
  migrate:
    build: { context: .., dockerfile: docker/Dockerfile, target: tools }
    image: smartgym-tools
    restart: "no"
    working_dir: /app/packages/db
    environment:
      MIGRATION_DATABASE_URL: postgresql://smartgym_owner:${OWNER_DB_PASSWORD:?}@postgres:5432/smartgym
      DATABASE_URL: postgresql://smartgym_owner:${OWNER_DB_PASSWORD:?}@postgres:5432/smartgym
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: docker/Dockerfile, target: web }
    image: smartgym-web
    restart: unless-stopped
    environment: *app-env
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    image: smartgym-tools
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
